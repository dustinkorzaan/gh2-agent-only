name: CI - UI

# No path filters: branch protection requires `gh-build-and-test-success`,
# and a filtered-out workflow never reports it, which blocks the PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on main (and CodeQL's
# weekly schedule) are never cancelled, so every main commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gh-build-and-test-success:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ui/ exists
        id: check
        run: |
          if [ -f ui/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ui/package.json not found yet; skipping UI CI."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ui
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: ui
        run: npm run lint --if-present

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: ui
        run: npm run build --if-present

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: ui
        run: |
          # `npm test --if-present` exits 0 (green) when package.json has no
          # "test" script at all, which would treat "nothing was tested" the
          # same as "tests passed".
          # Fail loudly instead once ui/ exists; lint/build can stay
          # --if-present since a missing lint/build script is not silently
          # mistaken for passing tests.
          if ! node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
            echo "::error::ui/package.json has no \"test\" script. The UI must have a runnable test suite before CI can be green." >&2
            exit 1
          fi
          npm test -- --run
