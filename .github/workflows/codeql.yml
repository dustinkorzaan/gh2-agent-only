name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "21 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

# A new push to a PR cancels that PR's older run. A push to main and the weekly
# schedule each get a group of their own (run_id), so neither is ever
# cancelled or replaced by a later run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_ui: ${{ steps.detect.outputs.has_ui }}
      has_api: ${{ steps.detect.outputs.has_api }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          shopt -s globstar nullglob
          if [ -f ui/package.json ]; then
            echo "has_ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ui=false" >> "$GITHUB_OUTPUT"
          fi
          sln_files=(api/*.sln)
          csproj_files=(api/**/*.csproj)
          if [ "${#sln_files[@]}" -gt 0 ] || [ "${#csproj_files[@]}" -gt 0 ]; then
            echo "has_api=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-ui:
    name: Analyze (javascript-typescript)
    needs: detect
    # Skip entirely when /ui isn't present yet — codeql-action/init fails
    # outright if it finds no source for the configured language, which
    # would otherwise fail CI for an api-only repo with no /ui tree yet.
    if: needs.detect.outputs.has_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  analyze-api:
    name: Analyze (csharp)
    needs: detect
    # Skip entirely when /api isn't present yet — same reasoning as
    # analyze-ui above, mirrored for a ui-only story with no /api tree yet.
    if: needs.detect.outputs.has_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: autobuild

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
