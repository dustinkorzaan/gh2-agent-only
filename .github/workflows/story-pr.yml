name: Story PR

# Opens and updates the draft PR for a story branch, because the Copilot cloud
# agent has no GitHub credentials in its session: it can push commits, but it
# can't create a PR or edit one (`gh pr create` / `gh pr edit` fail).
#
# On every push to a `copilot/**` branch that adds exactly one spec under
# docs/specs/:
# - no open PR for the branch: open a draft PR `[Story] <spec title>`;
# - open PR: set its title and description from the spec;
# - the description is the spec's block between `<!-- pr-description:start -->`
#   and `<!-- pr-description:end -->` (the story agents keep it current);
# - when the first non-empty line of that block is exactly
#   "✅ Ready for human review", publish the draft; otherwise (e.g. after a
#   revision removed the marker) return a published PR to draft.
#
# This only publishes or un-publishes a draft to mirror the spec's own
# description block. Publication is NOT an authorization or approval signal:
# it does not gate who may approve the spec or start delivery, and this
# workflow never approves, reviews or merges. Humans still approve the spec and
# squash-merge. A story branch is expected to add exactly one spec; if it adds
# more than one, the workflow fails loudly rather than guessing which to use.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests" ticked. No extra Actions or dependencies are used.

on:
  push:
    branches: ["copilot/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: story-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  story-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or update the story PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A story branch adds exactly one spec (ignoring the template). Fail
          # loudly on more than one rather than picking an arbitrary spec.
          specs=$(git diff --name-only --diff-filter=A origin/main...HEAD -- docs/specs/ \
            | grep -v '/_template\.md$' || true)
          count=$(printf '%s' "$specs" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "No new spec under docs/specs/ on $BRANCH; not a story branch."
            exit 0
          fi
          if [ "$count" -gt 1 ]; then
            echo "More than one new spec added on $BRANCH; this workflow supports exactly one story spec per branch:" >&2
            printf '%s\n' "$specs" >&2
            exit 1
          fi
          spec="$specs"
          echo "Spec: $spec"

          title="[Story] $(grep -m1 '^# ' "$spec" | sed 's/^# //')"
          body_file=$(mktemp)
          awk '/<!-- pr-description:end -->/{f=0} f{print} /<!-- pr-description:start -->/{f=1}' \
            "$spec" > "$body_file"
          if [ ! -s "$body_file" ]; then
            printf 'Story spec: `%s`\n\nThe story agents fill this in from the spec.\n' \
              "$spec" > "$body_file"
          fi

          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --draft --base main --head "$BRANCH" \
              --title "$title" --body-file "$body_file"
            pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$pr" --title "$title" --body-file "$body_file"
          fi
          echo "PR: #$pr"

          # Publish or un-publish the draft to mirror the spec's description
          # block. The marker must be the exact first non-empty line of the
          # block, not merely present somewhere in it. This is cosmetic: it
          # never authorizes approval, delivery or merge.
          first_line=$(grep -m1 '[^[:space:]]' "$body_file" || true)
          is_draft=$(gh pr view "$pr" --json isDraft --jq .isDraft)
          if [ "$first_line" = "✅ Ready for human review" ]; then
            if [ "$is_draft" = "true" ]; then
              gh pr ready "$pr"
            fi
          else
            if [ "$is_draft" = "false" ]; then
              gh pr ready "$pr" --undo
            fi
          fi
